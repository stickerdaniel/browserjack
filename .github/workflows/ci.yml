name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run verify:versions
      - run: npm run pack:check

  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          set +e
          BROWSERJACK_HOME="$RUNNER_TEMP/browserjack-smoke" node dist/cli.js status --json > status.json
          status_exit=$?
          set -e
          test "$status_exit" -eq 2
          node -e "const r = require('./status.json'); if (r.installed !== false) process.exit(1)"
          set +e
          node dist/cli.js doctor --json > doctor.json
          doctor_exit=$?
          set -e
          test "$doctor_exit" -eq 2
          node -e "const r = require('./doctor.json'); if (r.ready !== false) process.exit(1)"
