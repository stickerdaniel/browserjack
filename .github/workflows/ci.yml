name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run pack:check
      - name: CLI smoke test
        run: |
          node dist/cli.js --help
          set +e
          BROWSERJACK_HOME="$RUNNER_TEMP/browserjack-smoke" node dist/cli.js status --json > status.json
          status_exit=$?
          set -e
          test "$status_exit" -eq 2
          node -e "const r = require('./status.json'); if (r.installed !== false) process.exit(1)"
          set +e
          node dist/cli.js doctor --json > doctor.json
          doctor_exit=$?
          set -e
          test "$doctor_exit" -eq 2
          node -e "const r = require('./doctor.json'); if (r.ready !== false) process.exit(1)"
