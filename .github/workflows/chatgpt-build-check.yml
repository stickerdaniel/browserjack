name: ChatGPT build check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/chatgpt-build-check.yml
      - scripts/check-chatgpt-build.mjs

permissions:
  contents: read

concurrency:
  group: chatgpt-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'stickerdaniel/browserjack'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: check
        run: node scripts/check-chatgpt-build.mjs
        env:
          CHECK_REPORT: ${{ runner.temp }}/report.md
          FORCE_CHECK: ${{ github.event_name != 'schedule' && '1' || '' }}
      - name: Open an issue for the breaking build
        if: steps.check.outputs.failed == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT: ${{ runner.temp }}/report.md
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          title="ChatGPT.app $VERSION breaks Browserjack"
          open="$(gh issue list --state open --search "\"$title\" in:title" --json title --jq "map(select(.title == \"$title\")) | length")"
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body-file "$REPORT"
          fi
      - name: Fail on a breaking build
        if: steps.check.outputs.failed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          echo "::error::ChatGPT.app $VERSION breaks Browserjack"
          exit 1
