name: Bug report
description: Something is broken in Browserjack itself
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For exploitable security problems, use private vulnerability reporting instead of a public issue (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor --json output
      description: Run `browserjack doctor --json` and paste the output. Redact your username in paths. Never paste browser content, cookies, or tokens.
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Browserjack version, ChatGPT.app version, macOS version, Node.js version
      placeholder: browserjack 0.1.0, ChatGPT.app 26.715.72359, macOS 26.5, Node 22.14
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Google Chrome
        - Helium
        - Other Chromium-based
    validations:
      required: true
